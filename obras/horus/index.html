function setSyncBadge(estado) {
  const dot = document.getElementById("sync-dot");
  const txt = document.getElementById("sync-text");
  if (!dot || !txt) return;
  if (estado === "ok") { dot.style.background = "#5A8A6A"; txt.textContent = "Sincronizado"; }
  else if (estado === "guardando") { dot.style.background = "#E07B39"; txt.textContent = "Guardando..."; }
  else if (estado === "error") { dot.style.background = "#C0392B"; txt.textContent = "Sin conexión (local)"; }
  else { dot.style.background = "#E07B39"; txt.textContent = "Conectando..."; }
}

DB_DOC.onSnapshot(snap => {
  const data = snap.data();
  if (data) {
    pagos = data.pagos || {};
    cobros = data.cobros || {};
    render();
  }
  setSyncBadge("ok");
}, err => {
  console.error("Error de sincronización:", err);
  setSyncBadge("error");
});

function guardarCampo(campo, key, valor) {
  setSyncBadge("guardando");
  const update = {};
  update[campo] = { [key]: valor };
  update.actualizado = firebase.firestore.FieldValue.serverTimestamp();
  DB_DOC.set(update, { merge: true })
    .then(() => setSyncBadge("ok"))
    .catch(err => { console.error("Error guardando:", err); setSyncBadge("error"); });
}
// ---- Fin sincronización ----

function getManoTotal(tip) {
  return tip.trabajadores.reduce((a, w) => a + w.total, 0);
}
function getGanancia(tip) {
  return tip.totalArmado - getManoTotal(tip);
}
function getPagado(tip, apt) {
  return tip.trabajadores.reduce((acc, w) =>
    acc + w.etapas.reduce((a, e, i) =>
      a + (pagos[apt + "-" + w.id + "-" + i] ? e.monto : 0), 0), 0);
}
function getCobroPct(apt, i) {
  const v = cobros[apt + "-cobro-" + i];
  return typeof v === "number" ? v : 0;
}
function getCobradoCliente(tip, apt) {
  return COBROS_CLIENTE.reduce((a, c, i) =>
    a + tip.totalArmado * (getCobroPct(apt, i) / 100), 0);
}
function fmt(n) { return n.toFixed(2); }

function setCobroPct(apt, i, val) {
  let v = parseFloat(val);
  if (isNaN(v)) v = 0;
  v = Math.max(0, Math.min(100, v));
  const key = apt + "-cobro-" + i;
  cobros[key] = v;
  render();
  guardarCampo("cobros", key, v);
}
function togglePago(apt, wId, i) {
  const key = apt + "-" + wId + "-" + i;
  pagos[key] = !pagos[key];
  render();
  guardarCampo("pagos", key, pagos[key]);
}
function selectApt(apt, tipo) { selected = { apt, tipo }; render(); }
function goBack() { selected = null; render(); }
function setPisoFiltro(p) { pisoFiltro = p; render(); }

function exportarInformeTrabajador(workerId) {
  const rolRef = TIPOLOGIAS.A35.trabajadores.find(w => w.id === workerId);
  const rol = rolRef ? rolRef.rol : "";
  const fecha = new Date().toLocaleDateString("es-UY", { year: "numeric", month: "long", day: "numeric" });

  let totalGeneral = 0;
  let totalPagado = 0;
  let filasHtml = "";

  PISOS.forEach(piso => {
    const apts = APARTAMENTOS.filter(a => a.apt[0] === piso);
    let filasPiso = "";
    apts.forEach(({ apt, tipo }) => {
      const tip = TIPOLOGIAS[tipo];
      const w = tip.trabajadores.find(t => t.id === workerId);
      if (!w) return;
      const pagadoApt = w.etapas.reduce((a, e, i) => a + (pagos[apt + "-" + w.id + "-" + i] ? e.monto : 0), 0);
      totalGeneral += w.total;
      totalPagado += pagadoApt;
      const etapasPagadas = w.etapas
        .map((e, i) => pagos[apt + "-" + w.id + "-" + i] ? e.etapa : null)
        .filter(Boolean);
      const etapasTexto = etapasPagadas.length ? etapasPagadas.join(", ") : "—";
      filasPiso += `<tr style="border-bottom:1px solid #eee;"><td style="padding:4px 6px;">${apt}</td><td style="padding:4px 6px;">${tipo}</td><td style="padding:4px 6px;text-align:right;">$${w.total.toFixed(2)}</td><td style="padding:4px 6px;text-align:right;">$${pagadoApt.toFixed(2)}</td><td style="padding:4px 6px;text-align:right;">$${(w.total - pagadoApt).toFixed(2)}</td><td style="padding:4px 6px;color:${etapasPagadas.length ? "#5A8A6A" : "#bbb"};">${etapasTexto}</td></tr>`;
    });
    if (filasPiso) {
      filasHtml += `<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:700;margin-bottom:6px;background:#F0EDE8;padding:4px 8px;">Piso ${piso}</div><table style="width:100%;border-collapse:collapse;font-size:11px;"><thead><tr style="border-bottom:1px solid #ccc;text-align:left;"><th style="padding:4px 6px;">Apto</th><th style="padding:4px 6px;">Tipología</th><th style="padding:4px 6px;text-align:right;">Total</th><th style="padding:4px 6px;text-align:right;">Pagado</th><th style="padding:4px 6px;text-align:right;">Pendiente</th><th style="padding:4px 6px;">Etapas pagadas</th></tr></thead><tbody>${filasPiso}</tbody></table></div>`;
    }
  });

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Informe ${workerId} - Decosol | Horus</title>
    <style>
      body { font-family: 'Inter','Segoe UI',sans-serif; color:#1A1A1A; padding:24px; margin:0; }
      @media print { @page { margin: 16mm; } }
    </style></head>
    <body>
      <div style="text-align:center;margin-bottom:24px;border-bottom:2px solid #1A1A1A;padding-bottom:12px;">
        <div style="font-size:22px;font-weight:800;">Decosol | Horus</div>
        <div style="font-size:12px;color:#666;margin-top:2px;">Informe de Pagos — ${workerId} (${rol})</div>
        <div style="font-size:11px;color:#999;margin-top:2px;">Emitido el ${fecha}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:24px;">
        <tr>
          <td style="width:33%;text-align:center;padding:12px;background:#F0EDE8;border-radius:8px;">
            <div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;">Total a pagar</div>
            <div style="font-size:22px;font-weight:800;color:#1A1A1A;margin-top:4px;">$${totalGeneral.toFixed(2)}</div>
          </td>
          <td style="width:4%;"></td>
          <td style="width:33%;text-align:center;padding:12px;background:#E2EDE7;border-radius:8px;">
            <div style="font-size:10px;color:#5A8A6A;text-transform:uppercase;letter-spacing:1px;">Total pagado</div>
            <div style="font-size:22px;font-weight:800;color:#5A8A6A;margin-top:4px;">$${totalPagado.toFixed(2)}</div>
          </td>
          <td style="width:4%;"></td>
          <td style="width:33%;text-align:center;padding:12px;background:#FBEADD;border-radius:8px;">
            <div style="font-size:10px;color:#E07B39;text-transform:uppercase;letter-spacing:1px;">Total pendiente</div>
            <div style="font-size:22px;font-weight:800;color:#E07B39;margin-top:4px;">$${(totalGeneral - totalPagado).toFixed(2)}</div>
          </td>
        </tr>
      </table>
      <div style="font-size:12px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">Detalle por apartamento</div>
      ${filasHtml}
      <table style="width:100%;border-collapse:collapse;margin-top:8px;border-top:2px solid #1A1A1A;">
        <tr>
          <td style="padding:10px 6px;font-size:13px;font-weight:700;">TOTAL GENERAL</td>
          <td style="padding:10px 6px;font-size:13px;font-weight:800;text-align:right;">$${totalGeneral.toFixed(2)}</td>
          <td style="padding:10px 6px;font-size:13px;font-weight:800;text-align:right;color:#5A8A6A;">$${totalPagado.toFixed(2)}</td>
          <td style="padding:10px 6px;font-size:13px;font-weight:800;text-align:right;color:#E07B39;">$${(totalGeneral - totalPagado).toFixed(2)}</td>
        </tr>
      </table>
      <script>window.onload = function(){ window.print(); };<\/script>
    </body></html>`;

  const ventana = window.open("", "_blank");
  if (!ventana) {
    alert("El navegador bloqueó la ventana emergente. Habilitá los pop-ups para este sitio y volvé a intentar.");
    return;
  }
  ventana.document.open();
  ventana.document.write(html);
  ventana.document.close();
}

render();
</script>
</body>
</html>
